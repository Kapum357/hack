services:
  - type: web
    plan: free
    name: climate-resilience-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn flask_application:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000